<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDCORE — Centro de estudio</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FAF8F4">
</head>
<body>

<div class="shell">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="assets/nexu-logo.svg" alt="Nexu, la mascota de MEDCORE">
      <div class="brand-text">MEDCORE<small>Med. Interna</small></div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Estudio</div>
      <div class="nav-item active" data-view="view-inicio" onclick="showView('view-inicio')"><span class="emoji">🏠</span> Inicio</div>
      <div class="nav-item" data-view="view-semana" onclick="openSemana('semana-01')"><span class="emoji">📅</span> Semanas</div>
      <div class="nav-item" data-view="view-enfermedad" onclick="openEnfermedad('epoc')"><span class="emoji">🔎</span> Enfermedades</div>
    </div>

    <div class="nav-group">
      <div class="nav-label">Próximamente</div>
      <div class="nav-item"><span class="emoji">🩺</span> Semiología</div>
      <div class="nav-item"><span class="emoji">💊</span> Farmacología</div>
      <div class="nav-item"><span class="emoji">🏥</span> Hospital</div>
      <div class="nav-item"><span class="emoji">📚</span> Lecturas</div>
      <div class="nav-item"><span class="emoji">📝</span> Mis apuntes</div>
      <div class="nav-item"><span class="emoji">⭐</span> Favoritos</div>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <div id="auth-bar"></div>

    <div class="topbar">
      <div class="search-box">
        🔍 <input id="global-search" type="text" placeholder="Buscar enfermedad, semana, lectura…">
        <span class="key">Ctrl K</span>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- VISTA: INICIO -->
    <section id="view-inicio" class="view">
      <div id="inicio-hero"></div>
      <div id="inicio-semana-actual" style="margin-bottom:28px;"></div>
      <div class="section-title"><h2>Enfermedades de esta semana</h2></div>
      <div class="grid cols-2" id="inicio-enfermedades"></div>
    </section>

    <!-- VISTA: SEMANA -->
    <section id="view-semana" class="view">
      <div id="view-semana-content"></div>
    </section>

    <!-- VISTA: ENFERMEDAD -->
    <section id="view-enfermedad" class="view">
      <div id="view-enfermedad-content"></div>
    </section>

  </main>
</div>

<script src="data.js"></script>
<script src="icons.js"></script>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="notes.js"></script>
<script src="draw.js"></script>
<script src="app.js"></script>
</body>
</html>
